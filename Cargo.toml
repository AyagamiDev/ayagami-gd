[package]
name = "ayagami-gd"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ayagami = { git = "https://github.com/AyagamiDev/ayagami.git", branch = "part-depth-stuff" }
fastxfix = "1.0.0"
glob = "0.3.3"
godot = "0.5.4"
serde = "1.0.229"
serde_json = "1.0.151"

[profile.dev]
opt-level = 3
debug=1

[profile.dev.package.ayagami]
opt-level = 3
debug = 0
