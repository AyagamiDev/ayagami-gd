name: Build Project
on:
  push:
env:
  project: ayagami-gd
  
jobs:
  build:
    name: Builds extensions for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Use bash shells on all platforms.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            output: libgodot_keylogger
            ext: so
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - name: Build extension
        run: make package target=${{ matrix.target }}
      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.project }}.${{ matrix.platform }}
          path: addons/ayagami/lib/*

  release:
    name: Package Addon
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        # Use bash shells on all platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Prepare package
        run: |
          mkdir -p pkg/addons
          cp -r godot/addons/ayagami pkg/addons
          find artifacts/ -type f -print0 | xargs -0 cp -t "pkg/addons/ayagami/lib"
          cp LICENSE.md README.md "pkg/addons/ayagami"
      - name: Generate Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.project }}
          path: pkg
